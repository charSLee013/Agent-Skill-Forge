description = "Keep an approved implementation correct and minimal"
prompt = "Activate Ponytail for this implementation session. Treat the approved issue, PRD, ADRs, non-goals, and acceptance evidence as fixed input. Read and trace the real flow first. Reuse repository mechanisms, standard libraries, native platform features, and installed dependencies before writing the minimum new code. Correctness, security, required error handling, repository fit, and acceptance evidence always outrank fewer lines. Do not reopen product direction, invent adjacent work, impose TDD, or weaken verification."
